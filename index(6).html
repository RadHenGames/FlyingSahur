<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flying Sahur</title>
  <meta name="description" content="Flying Sahur — dodge obstacles and survive as long as you can. Free to play in your browser." />

  <!-- ═══════════════════════════════════════════════════════════

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0f;
      --surface:   #16161a;
      --border:    #2a2a30;
      --text:      #e8e6f0;
      --muted:     #6b6880;
      --accent:    #f5a623;
      --accent2:   #c062f5;
      --game-w:    960px;
      --game-h:    540px;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-decoration: none;
    }

    .logo span { color: var(--text); font-weight: 400; }

    /* ── TOP LEADERBOARD AD ── */
    .ad-top {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-height: 90px;
      padding: 8px 0;
    }

    /* ── MAIN LAYOUT ── */
    .main {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 20px 16px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── SIDEBAR ADS ── */
    .ad-sidebar {
      flex-shrink: 0;
      width: 160px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 4px;
    }

    /* ── GAME COLUMN ── */
    .game-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      width: var(--game-w);
      max-width: 100%;
    }

    .game-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--text);
      text-align: center;
    }

    .game-title em {
      font-style: normal;
      color: var(--accent);
    }

    /* ── GAME FRAME ── */
    .game-wrap {
      position: relative;
      width: var(--game-w);
      max-width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .game-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading overlay */
    .game-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #000;
      color: var(--muted);
      font-size: 0.9rem;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .game-loading.hidden { opacity: 0; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── BELOW-GAME AD ── */
    .ad-below {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 90px;
    }

    /* ── AD PLACEHOLDER STYLE (remove once real ads are in) ── */
    .ad-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .ad-placeholder.leaderboard { width: 728px; height: 90px; }
    .ad-placeholder.rectangle  { width: 160px; height: 600px; }
    .ad-placeholder.banner     { width: 728px; height: 90px; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 8px;
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    /* ── RESPONSIVE ── */
    @media (max-width: 1100px) {
      .ad-sidebar { display: none; }
    }

    @media (max-width: 680px) {
      .ad-placeholder.leaderboard,
      .ad-placeholder.banner { width: 320px; height: 50px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a class="logo" href="#">Flying Sahur <span>by Rad Hen Games</span></a>
  </header>

  <!-- TOP LEADERBOARD AD -->
  <div class="ad-top">
    <!-- ADSENSE LEADERBOARD (728×90)
         Replace placeholder div with real ad unit once approved:

    <ins class="adsbygoogle"
         style="display:inline-block;width:728px;height:90px"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
    <div class="ad-placeholder leaderboard">Ad · 728×90</div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- LEFT SIDEBAR AD -->
    <aside class="ad-sidebar">
      <!-- ADSENSE RECTANGLE (160×600)
           Replace placeholder div with real ad unit once approved:

      <ins class="adsbygoogle"
           style="display:inline-block;width:160px;height:600px"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="XXXXXXXXXX"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      -->
      <div class="ad-placeholder rectangle">Ad · 160×600</div>
    </aside>

    <!-- GAME COLUMN -->
    <div class="game-column">
      <h1 class="game-title">Flying <em>Sahur</em></h1>

      <div class="game-wrap" id="gameWrap">
        <div class="game-loading" id="loadingOverlay">
          <div class="spinner"></div>
          <span>Loading game…</span>
        </div>
        <!-- The Godot HTML5 export lives in /game/index.html -->
        <iframe
          id="gameFrame"
          src="game/index.html"
          allowfullscreen
          allow="autoplay; fullscreen"
          title="Flying Sahur game"
          onload="document.getElementById('loadingOverlay').classList.add('hidden')"
        ></iframe>
      </div>

      <!-- BELOW-GAME AD -->
      <div class="ad-below">
        <!-- ADSENSE BANNER (728×90)
             Replace placeholder div with real ad unit once approved:

        <ins class="adsbygoogle"
             style="display:inline-block;width:728px;height:90px"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="XXXXXXXXXX"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        -->
        <div class="ad-placeholder banner">Ad · 728×90</div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR AD -->
    <aside class="ad-sidebar">
      <!-- ADSENSE RECTANGLE (160×600) — same unit or a different slot
           Replace placeholder div with real ad unit once approved:

      <ins class="adsbygoogle"
           style="display:inline-block;width:160px;height:600px"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="XXXXXXXXXX"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      -->
      <div class="ad-placeholder rectangle">Ad · 160×600</div>
    </aside>

  </div><!-- /main -->

  <!-- FOOTER -->
  <footer>
    <span>© 2025 Rad Hen Games</span>
    <span>
      <a href="https://radhengames.github.io/privacy/" target="_blank">Privacy Policy</a>
    </span>
  </footer>

</body>
</html>
